[workspace]
resolver = "3"
members = [
	"outpost",
]

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.11"
liblzma = { version = "=0.4.9", features = ["static"] }
percent-encoding = "=2.3.2"
rayon = "=1.12.0"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", features = ["json"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tar = "=0.4.46"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
toml = "=1.2.1"
wiremock = "=0.6.5"
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2"] }

[package]
name = "outpost"
version = "0.0.0"
edition = "2024"
autotests = false

[features]
trampoline = []

[[bin]]
name = "op"
path = "main.rs"

[[bin]]
name = "op_shim"
path = "bin/trampoline.rs"
required-features = ["trampoline"]
test = false

[[test]]
name = "list"
path = "_tests/list.rs"

[[test]]
name = "install"
path = "_tests/install.rs"

[[test]]
name = "exec"
path = "_tests/exec.rs"

[[test]]
name = "shim"
path = "_tests/shim.rs"

[dependencies]
clap.workspace = true
flate2.workspace = true
globset.workspace = true
liblzma.workspace = true
percent-encoding.workspace = true
rayon.workspace = true
regex.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tar.workspace = true
terminal_size.workspace = true
tokio.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
indoc.workspace = true
tempfile.workspace = true
wiremock.workspace = true

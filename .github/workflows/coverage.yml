on:
  workflow_call:
    secrets:
      codecov_token:
        required: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: setup_rust
        run: rustup toolchain install && rustup component add llvm-tools-preview
      - name: setup_tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: nextest cargo-llvm-cov
      - name: setup_kache
        uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          cache-dir: ${{ runner.temp }}/kache
          pr-comment: false
      - name: coverage
        run: cargo llvm-cov nextest --workspace --locked --profile ci --lcov --output-path lcov.info
      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          token: ${{ secrets.codecov_token }}
